name: tru-grow

on:
  schedule:
    # Weekly, Monday 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "Minimum source-commit age in days (0 for bootstrap; default is the 6-day verification buffer)"
        required: false
        default: "6"
      repos:
        description: "Optional space-separated owner/repo[@ref] list; overrides shelf/watchlist.txt when set"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve repos and min age
        id: watch
        run: |
          set -euo pipefail
          MIN_AGE="${{ github.event.inputs.min_age_days }}"
          if [ -z "${MIN_AGE}" ]; then MIN_AGE=6; fi
          echo "min_age=${MIN_AGE}" >> "$GITHUB_OUTPUT"

          INPUT_REPOS="${{ github.event.inputs.repos }}"
          if [ -n "${INPUT_REPOS}" ]; then
            REPOS="${INPUT_REPOS}"
          else
            REPOS=$(grep -vE '^[[:space:]]*(#|$)' shelf/watchlist.txt | tr '\n' ' ' | xargs || true)
          fi
          if [ -z "${REPOS}" ]; then
            echo "No repos to process"
            echo "repos=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "repos=${REPOS}" >> "$GITHUB_OUTPUT"
          echo "Watch list: ${REPOS}"
          echo "min_age_days: ${MIN_AGE}"

      - name: Propose packs (pull + stage)
        if: steps.watch.outputs.repos != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tru_propose links github_pull → tru_shelf propose.
          python3 tools/tru_propose.py \
            --min-age-days "${{ steps.watch.outputs.min_age }}" \
            --keep-packs \
            --out packs/grow \
            ${{ steps.watch.outputs.repos }} \
            || true
          # || true: individual repos may fail propose (too young, already on shelf);
          # continue so we can establish whatever did stage.

      - name: List staging
        id: staging
        run: |
          set -euo pipefail
          python3 tools/tru_shelf.py list | tee /tmp/staging.txt
          if grep -q 'staging is empty' /tmp/staging.txt; then
            echo "has_staging=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_staging=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve staged packs onto main shelf
        if: steps.staging.outputs.has_staging == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fully automatic establishment. Age-gate + hash + provenance checks already ran.
          # No human PR gate.
          while read -r line; do
            id=$(echo "$line" | awk '{print $1}')
            [ -z "$id" ] && continue
            case "$id" in
              staging|is|empty) continue ;;
            esac
            echo "Approving $id"
            python3 tools/tru_shelf.py \
              --min-age-days "${{ steps.watch.outputs.min_age }}" \
              approve "$id" --by "tru-grow[bot]"
          done < <(python3 tools/tru_shelf.py list | grep -v 'staging is empty' || true)

      - name: Shelf check
        if: steps.staging.outputs.has_staging == 'true'
        run: python3 tools/tru_shelf.py check

      - name: Commit and push established packs to main
        if: steps.staging.outputs.has_staging == 'true'
        run: |
          set -euo pipefail
          git config user.name "tru-grow[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the shelf artifacts should change
          git add shelf/manifest.jsonl shelf/packs/ || true

          if git diff --cached --quiet; then
            echo "No shelf changes to commit"
            exit 0
          fi

          git commit -m "TRU grow: establish packs that cleared automated checks

  - 6-day verification buffer applied
  - hashes and provenance verified
  - established directly by tru-grow[bot] (no human PR gate)"

          git push origin HEAD:main
