name: tru-grow

on:
  schedule:
    # Weekly, Monday 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "Minimum source-commit age in days (default 0 = no age gate, knowledge flows free)"
        required: false
        default: "0"
      repos:
        description: "Optional space-separated owner/repo[@ref] list; overrides shelf/watchlist.txt when set"
        required: false
        default: ""
  push:
    paths:
      - 'shelf/inbox/**'
  repository_dispatch:
    types: [tru-intake]

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve repos and min age
        id: watch
        run: |
          set -euo pipefail
          MIN_AGE="${{ github.event.inputs.min_age_days || '0' }}"
          if [ -z "${MIN_AGE}" ]; then MIN_AGE=0; fi
          echo "min_age=${MIN_AGE}" >> "$GITHUB_OUTPUT"

          # Watchlist path (proactive scan of known sources)
          INPUT_REPOS="${{ github.event.inputs.repos }}"
          if [ -n "${INPUT_REPOS}" ]; then
            REPOS="${INPUT_REPOS}"
          else
            REPOS=$(grep -vE '^[[:space:]]*(#|$)' shelf/watchlist.txt 2>/dev/null | tr '\n' ' ' | xargs || true)
          fi
          echo "repos=${REPOS}" >> "$GITHUB_OUTPUT"
          echo "Watch list: ${REPOS}"
          echo "min_age_days: ${MIN_AGE}"

      - name: Process inbox packs (external agent path)
        id: inbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p shelf/inbox
          INBOX_PACKS=$(find shelf/inbox -name '*.tru-github-pack.json' 2>/dev/null | head -50 || true)
          if [ -z "${INBOX_PACKS}" ]; then
            echo "has_inbox=false" >> "$GITHUB_OUTPUT"
            echo "No packs in shelf/inbox/"
            exit 0
          fi
          echo "has_inbox=true" >> "$GITHUB_OUTPUT"
          echo "Processing inbox packs:"
          for pack in ${INBOX_PACKS}; do
            echo "  propose ${pack}"
            python3 tools/tru_shelf.py --min-age-days "${{ steps.watch.outputs.min_age }}" propose "${pack}" || true
          done

      - name: Propose packs from watchlist
        if: steps.watch.outputs.repos != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/tru_propose.py \
            --min-age-days "${{ steps.watch.outputs.min_age }}" \
            --keep-packs \
            --out packs/grow \
            ${{ steps.watch.outputs.repos }} \
            || true

      - name: List staging
        id: staging
        run: |
          set -euo pipefail
          python3 tools/tru_shelf.py list | tee /tmp/staging.txt
          if grep -q 'staging is empty' /tmp/staging.txt; then
            echo "has_staging=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_staging=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve staged packs onto main shelf
        if: steps.staging.outputs.has_staging == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fully automatic. Integrity + provenance checks only. No age gate. No human gate.
          while read -r line; do
            id=$(echo "$line" | awk '{print $1}')
            [ -z "$id" ] && continue
            case "$id" in
              staging|is|empty) continue ;;
            esac
            echo "Approving $id"
            python3 tools/tru_shelf.py \
              --min-age-days "${{ steps.watch.outputs.min_age }}" \
              approve "$id" --by "tru-grow[bot]"
          done < <(python3 tools/tru_shelf.py list | grep -v 'staging is empty' || true)

      - name: Shelf check
        if: steps.staging.outputs.has_staging == 'true'
        run: python3 tools/tru_shelf.py check

      - name: Commit and push established packs + clear processed inbox
        if: steps.staging.outputs.has_staging == 'true' || steps.inbox.outputs.has_inbox == 'true'
        run: |
          set -euo pipefail
          git config user.name "tru-grow[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clear successfully processed inbox packs so the pipe stays clean
          if [ "${{ steps.inbox.outputs.has_inbox }}" = "true" ]; then
            find shelf/inbox -name '*.tru-github-pack.json' -delete || true
            # keep a marker so the directory survives
            touch shelf/inbox/.gitkeep
          fi

          git add shelf/manifest.jsonl shelf/packs/ shelf/inbox/ || true

          if git diff --cached --quiet; then
            echo "No shelf changes to commit"
            exit 0
          fi

          git commit -m "TRU grow: establish packs that cleared integrity checks

  - open pipe (no age gate, no human gate)
  - inbox + watchlist paths both feed the same checks
  - established directly by tru-grow[bot]"

          git push origin HEAD:main
